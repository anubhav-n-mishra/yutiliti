name: Yuitility Production CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  verify:
    name: Build & Quality Gates (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Gate 1 — TypeScript Strict Typecheck
        run: npm run typecheck

      - name: Gate 2 — Static Syntax & Security Lint
        run: npm run lint

      - name: Gate 3 — Unit Tests & Static SEO Guardrails
        run: npm test

      - name: Gate 4 — Production Build Verification
        run: npm run build
